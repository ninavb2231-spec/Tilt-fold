
name: Bouw TiltFold Lid 1.4 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android SDK installeren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: TiltFold 1.4 uitpakken
        run: unzip -q TiltFold-Android-1.4-LidFold-broncode.zip

      - name: Versie controleren
        run: |
          grep -Fq "versionName '1.4'" TiltFoldAndroid/app/build.gradle
          grep -Fq "applicationId 'nl.tiltfold.lidfold'" TiltFoldAndroid/app/build.gradle

      - name: APK bouwen
        run: gradle -p TiltFoldAndroid :app:assembleDebug --no-daemon

      - name: APK controleren
        run: |
          APK=TiltFoldAndroid/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          cp "$APK" TiltFold-LID-1.4.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TiltFold-LID-1.4-APK
          path: TiltFold-LID-1.4.apk
          if-no-files-found: error
