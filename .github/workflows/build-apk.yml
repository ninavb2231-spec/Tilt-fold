name: Bouw nieuwste TiltFold APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK installeren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kies nieuwste TiltFold-broncode
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'TiltFold-Android-*-broncode.zip' -printf '%f\n' | sort -V | tail -1)
          if [ -z "$ZIP" ]; then echo 'Geen TiltFold-broncode ZIP gevonden in main'; exit 1; fi
          echo "Bouwen uit: $ZIP"
          unzip -q "$ZIP"
          test -f TiltFoldAndroid/app/build.gradle
      - name: Bouw APK
        run: gradle -p TiltFoldAndroid :app:assembleDebug --no-daemon
      - name: Controleer en geef herkenbare bestandsnaam
        run: |
          APK=TiltFoldAndroid/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          VERSION=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          test -n "$VERSION"
          cp "$APK" "TiltFold-$VERSION.apk"
          echo "APK is TiltFold-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TiltFold-NIEUWSTE-APK
          path: TiltFold-*.apk
          if-no-files-found: error
