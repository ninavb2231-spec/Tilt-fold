name: Bouw TiltFold DuoGlass 1.6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Controleer en pak broncode uit
        run: |
          test -f TiltFold-Android-1.6-DuoGlass-broncode.zip || { echo 'Upload eerst de 1.6 ZIP naar main'; exit 1; }
          unzip -q TiltFold-Android-1.6-DuoGlass-broncode.zip
          grep -Fq "versionName '1.6'" TiltFoldAndroid/app/build.gradle
          grep -Fq "applicationId 'nl.tiltfold.duoglass'" TiltFoldAndroid/app/build.gradle
      - name: Bouw APK
        run: gradle -p TiltFoldAndroid :app:assembleDebug --no-daemon
      - name: Controleer APK en geef juiste naam
        run: |
          APK=TiltFoldAndroid/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='1.6'"
          cp "$APK" TiltFold-DuoGlass-1.6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TiltFold-DUOGLASS-1.6-APK
          path: TiltFold-DuoGlass-1.6.apk
          if-no-files-found: error
