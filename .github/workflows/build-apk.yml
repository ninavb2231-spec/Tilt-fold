
name: Bouw TiltFold APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: unzip -q TiltFold-Android-1.3-broncode.zip
      - run: gradle -p TiltFoldAndroid :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TiltFold-APK
          path: TiltFoldAndroid/app/build/outputs/apk/debug/app-debug.apk
